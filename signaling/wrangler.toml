# Room signaling for online play. Deploy with `npx wrangler deploy`
# (free Cloudflare account). See signaling/README.md.
name = "cakum-pakum-signaling"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan only allows SQLite-backed Durable Objects (we store nothing).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Stats and leaderboards (src/stats.js). Create once with
#   npx wrangler d1 create cakum-pakum-stats
# put the printed database_id here, then
#   npx wrangler d1 migrations apply cakum-pakum-stats --remote
[[d1_databases]]
binding = "DB"
database_name = "cakum-pakum-stats"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Handed to every player on connect, so a TURN relay can be added here later
# without re-exporting the game.
ICE_SERVERS = '[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]'
# Password hashing rounds for new logins (src/password.js). 15000 (~9 ms) fits the
# free plan's 10 ms CPU per request; up to 100000 on the paid plan.
PBKDF2_ITERATIONS = "15000"
# Optional comma-separated list of allowed page origins; empty = allow all.
ALLOWED_ORIGINS = ""
